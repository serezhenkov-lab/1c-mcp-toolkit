name: openspec-1c
version: 1
description: Исследование и минимальные проверяемые изменения проектов 1С 8.x
artifacts:
  - id: proposal
    generates: proposal.md
    description: Проблема, границы и затрагиваемое поведение
    template: proposal.md
    instruction: |
      Опиши задачу и границы изменения по-русски. Укажи источники и неизвестные.
      Проверь существующие openspec/specs; перечисли новые и изменяемые capabilities
      с точными путями. Не придумывай требование для изменения без нового поведения.
      Для исправления укажи связанные ERR и ссылки на карточки, если они есть.
    requires: []
  - id: specs
    generates: "specs/**/*.md"
    description: Требования и наблюдаемые сценарии приёмки
    template: spec.md
    instruction: |
      Создай delta specs для capabilities из proposal. Используй служебные заголовки
      OpenSpec ADDED Requirements, MODIFIED Requirements, REMOVED Requirements,
      RENAMED Requirements; Requirement: и Scenario: сохраняй в оригинале.
      Текст пиши по-русски, нормативные требования формулируй с SHALL/MUST.
      Каждое требование имеет минимум один #### Scenario: с WHEN/THEN.
      Для MODIFIED скопируй полный существующий блок требования со всеми сценариями.
      Для REMOVED укажи Reason и Migration. Для новой capability добавь ## Purpose.
      Описывай поведение и ограничения, а не внутренние процедуры реализации.
    requires: [proposal]
  - id: research
    generates: research.md
    description: Подтверждённый текущий механизм и ограничения источников
    template: research.md
    instruction: |
      При skip_specs: true используй действующие openspec/specs и ссылки из proposal.
      Исследуй существующий код и метаданные по требованиям. Приведи точные объекты,
      процедуры, пути и ссылки на доказательства. Отдели факты от гипотез.
      Проверь точки расширения, поддержку, клиент/сервер, права, данные и обмены
      в затронутой области. Не изменяй код; недоступные источники укажи явно.
    requires: [specs]
  - id: design
    generates: design.md
    description: Техническое решение с учётом особенностей 1С
    template: design.md
    instruction: |
      На основе specs и research предложи минимальное изменение реального механизма.
      При skip_specs: true требования берутся из действующих openspec/specs.
      Обоснуй основную конфигурацию, расширение или внешний артефакт; рассмотренные
      альтернативы и неприменимые аспекты обозначь кратко. Отрази транзакции,
      блокировки, права, клиент/сервер, повторный запуск, совместимость и откат.
      Не объявляй решение согласованным без основания в поручении пользователя.
    requires: [specs, research]
  - id: task-cards
    generates: "tasks/TASK-*.md"
    description: Карточки укрупнённых задач с единой нумерацией проекта
    template: task-card.md
    instruction: |
      Выдели самостоятельные группы работ по решению. Одна карточка соответствует
      укрупнённой задаче, а не отдельному шагу реализации или проверки.
      Создай tasks/TASK-NNN.md внутри текущего изменения по шаблону.
      Заголовок карточки: # <Имя папки проекта> / TASK-NNN — Название задачи.
      Имя проекта — последний компонент planningHome.root, а не имя change
      или номер BPM-тикета; например: # 1690395 / TASK-002 — Источники и расчёт.
      Сохраняй фактический TASK-ID и имя файла карточки.
      TASK-001, TASK-002 и далее нумеруются сквозным образом в проекте OpenSpec.
      Перед выдачей номера прочитай <planningHome.root>/openspec/numbering.yaml:
      last_issued хранит последний выданный номер отдельно для TASK, ERR и других
      используемых префиксов. Найди карточки во всех активных и архивных changes.
      Новый TASK равен max(last_issued.TASK, максимальный найденный TASK) + 1.
      При отсутствии файла или префикса восстанови минимум по существующим
      артефактам; если их нет, считай исходное значение равным 0.
      Сохрани выданный номер в last_issued.TASK, сохраняя остальные поля и префиксы.
      Счётчик не уменьшай; номера не переиспользуй и не перенумеровывай.
      При повторном запуске обновляй существующие карточки без выдачи новых ID.
      Повреждённый YAML, недоступные источники и дубли ID требуют устранения
      до выдачи номера. Выдачу номеров выполняй последовательно одним автором.
      Укажи цель, требования и сценарии, границы, затрагиваемые объекты, технические
      указания, зависимости от TASK, критерии приёмки и доказательства результата.
      В разделе «План выполнения» перечисли полный состав шагов с номерами
      и способами проверки обычным списком без чекбоксов и статусов выполнения.
      Состав, порядок, номера и формулировки шагов должны совпадать с разделом
      tasks.md изменения; при подготовке карточки до tasks задай шаги для него.
      При изменении состава шагов синхронно обновляй карточку и tasks.md.
      Ссылку на раздел tasks.md сохрани; она не заменяет описание шагов.
      Чекбоксы и прогресс хранятся только в tasks.md изменения.
      Единственный план с чекбоксами — tasks.md изменения. Корневой openspec/tasks.md
      не создавай. В numbering.yaml не храни названия, ссылки, статусы и чекбоксы.
      BPM-тикет укажи только если он уже существует; автоматически не создавай.
    requires: [specs, design]
  - id: tasks
    generates: tasks.md
    description: План реализации и необходимых проверок
    template: tasks.md
    instruction: |
      Каждая карточка TASK образует раздел ## 1. TASK-001 — Название со ссылкой
      на tasks/TASK-001.md. Каждый раздел работ соответствует одной карточке.
      Внутри раздела шаги имеют формат - [ ] 1.1 Описание и способ проверки.
      Подпункты 1.1, 1.2 не получают отдельных TASK-номеров и карточек.
      Перенеси состав шагов из карточек; при уточнении состава, порядка, номеров
      или формулировок синхронно обнови их обычные списки в карточках.
      Статусы чекбоксов в карточки не переноси.
      Располагай группы и шаги по зависимостям. Каждый шаг содержит способ
      подтверждения завершения: команду, сценарий, результат или артефакт.
      Проверки и документацию включай в свою группу; отдельная финальная группа
      нужна только для общей интеграционной проверки. Требования и сценарии
      связывай через карточку. Обозначь ограничения среды и доступные проверки.
      Не включай миграцию истории без поручения. Архивирование и действия после
      него оформляй обычными пунктами вне чекбоксов прогресса реализации.
      Чекбоксы отмечай выполненными только по подтверждённому результату.
    requires: [specs, design, task-cards]
apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Учитывай поручение пользователя и уже согласованные решения. Если поручение
    ограничено анализом или оценкой, не переходи к реализации. Наличие артефактов
    не является разрешением на изменение кода. При разрешённой реализации читай
    specs, research, design и tasks; делай точечные изменения существующих объектов.
    При skip_specs: true читай действующие требования по ссылкам из proposal.
    Отмечай завершённые задачи по доказательствам. Раздельно фиксируй static,
    build/load, runtime и бизнес-приёмку; недоступные проверки не считай пройденными.
    Перед работой над группой прочитай её карточку TASK. Прогресс меняй только
    в tasks.md; в карточку добавляй результат и доказательства без копии чекбоксов.
    При изменении состава шагов синхронизируй их описание в карточке и tasks.md.
    Выполнение шагов не означает бизнес-приёмку. При архивировании сохраняй
    TASK-номера и карточки, проверяй ссылки после переноса в архив.
    Счётчики openspec/numbering.yaml при архивировании не уменьшай.
